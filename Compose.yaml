name: gamematch
services:
  # Navnet på den første service vi laver "api"
  api:
    build:
      # Vi sætter root mappen til at være hvor der buildes fra
      context: .
      # Navnet på den specifikke fil Docker Compose bruger til "api" servicen
      dockerfile: Dockerfile.Api
    ports:
      # Port mapping til port 5443
      - "127.0.0.1:5443:8443"
    environment:
      # Overrider Dockerfile til at Web API kører på port 8443 ved secure og 8080 ved unsecure
      # inde i containeren - mappes derefter ovenover til port 5443 eksternt
      # fra containerens interne 8443 port
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      # Certifikat placering og password, for at køre HTTPS
      Kestrel__Certificates__Default__Path: /https/localhost.pfx
      Kestrel__Certificates__Default__Password: "${CERT_PASSWORD:?Kør Forbered-HTTPS.ps1 først}"
    volumes:
      # Det her bruges til at mount certifikatet til HTTPS på Linux
      - ./.certs:/https:ro
  # Navnet på den anden service vi laver "web" og er til Blazor
  web:
    build:
      # Vi sætter root mappen til at være hvor der buildes fra
      context: .
      # Navnet på den specifikke fil Docker Compose bruger til "api" servicen
      dockerfile: Dockerfile.Web
    ports:
      # Port mapping til port 5143
      - "127.0.0.1:5143:8443"
    environment:
      # Overrider Dockerfile til at Blazor kører på port 8443 ved secure og 8080 ved unsecure
      # inde i containeren - mappes derefter ovenover til port 5143 eksternt
      # fra containerens interne 8443 port
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      Kestrel__Certificates__Default__Path: /https/localhost.pfx
      Kestrel__Certificates__Default__Password: "${CERT_PASSWORD:?Kør Forbered-HTTPS.ps1 først}"
    volumes:
      # Det her bruges til at mount certifikatet til HTTPS på Linux
      - ./.certs:/https:ro
    depends_on:
      # sætter dependency til "api" servicen ovenover
      - api
